syntax = "proto3";

package wechat;

// 消息类型
enum MsgType {
  TEXT = 1;
  IMAGE = 2;
  VOICE = 3;
  VIDEO = 4;
  FILE = 5;
  LOCATION = 6;
  LINK = 7;
  SYSTEM = 100;
  CUSTOM = 200;
}

// 消息状态
enum MsgStatus {
  SENDING = 0;
  SENT = 1;
  DELIVERED = 2;
  READ = 3;
  FAILED = 4;
}

// 聊天类型
enum ChatType {
  PRIVATE = 0;
  GROUP = 1;
}

// 消息体
message Message {
  string msg_id = 1;
  string from_uid = 2;
  optional string to_uid = 3;
  optional string to_group_id = 4;
  ChatType chat_type = 5;
  MsgType msg_type = 6;
  string content = 7;
  MsgStatus status = 8;
  optional uint64 client_seq = 9;
  uint64 server_seq = 10;
  int64 created_at = 11;
}

// 会话
message Conversation {
  string conversation_id = 1;
  ChatType chat_type = 2;
  string target_id = 3;
  optional Message last_msg = 4;
  uint32 unread_count = 5;
  bool is_top = 6;
  bool is_muted = 7;
  int64 updated_at = 8;
}

// WS 上行
message WSRequest {
  string cmd = 1;
  uint64 seq = 2;
  bytes body = 3;
}

// WS 下行
message WSResponse {
  string cmd = 1;
  uint64 seq = 2;
  bytes body = 3;
}
