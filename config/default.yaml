# wechat-clone — base configuration (all environments)
# This file defines every config key. Environment-specific files override these values.

app:
  name: wechat-clone
  env: development
  log_level: info

gateway:
  host: localhost
  port: 3000

services:
  auth:
    host: localhost
    port: 3001
  message:
    host: localhost
    port: 3002
  contact:
    host: localhost
    port: 3003
  group:
    host: localhost
    port: 3004
  file:
    host: localhost
    port: 3005
  moments:
    host: localhost
    port: 3006
  push:
    host: localhost
    port: 3007
  search:
    host: localhost
    port: 3008
  redpacket:
    host: localhost
    port: 3009
  qrcode:
    host: localhost
    port: 3010

database:
  postgres:
    host: localhost
    port: 5432
    database: wechat
    user: wechat
  redis:
    host: localhost
    port: 6379
  mongodb:
    uri: mongodb://localhost:27017/wechat

jwt:
  secret: ${JWT_SECRET}
  access_expire: 2h
  refresh_expire: 7d
